# 校园办事小秘书 · 容器编排（frontend + backend + MySQL）
#
# 使用步骤（详见 backend/docs/deploy.md）：
#   1) 仓库根目录创建 .env（参考 .env.example，不入库），至少填写：
#        MYSQL_PASSWORD / MYSQL_ROOT_PASSWORD
#        模型服务凭证二选一：AGENTARTS_API_KEY + AGENTARTS_AGENT_ID（推荐，走智能体工作流）
#                            或 MAAS_API_KEY（直连 MaaS 模型）
#   2) docker compose up -d --build
#   3) 首次部署导入知识库（宿主机执行，幂等，见 backend/docs/deploy.md §3）
#
# 关键约定：
#   - 后端容器启动时先跑 alembic upgrade head（带等待数据库重试），再启动 uvicorn；
#   - APP_ENV 固定为 production：本地替身实现不会在部署环境生效，
#     未配置模型凭证时问答接口明确返回 503，而不是给出占位答案；
#   - db 端口只绑定 127.0.0.1，仅供宿主机导入知识库，不对外暴露；
#   - 后端健康检查定义在 backend/Dockerfile（HEALTHCHECK），此处直接复用。

services:
  frontend:
    build:
      context: ./frontend
    container_name: campus-service-assistant-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    container_name: campus-service-assistant-backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://app:app@db:3306/campus}
      AGENTARTS_API_KEY: ${AGENTARTS_API_KEY:-}
      AGENTARTS_BASE_URL: ${AGENTARTS_BASE_URL:-}
      AGENTARTS_AGENT_ID: ${AGENTARTS_AGENT_ID:-}
      MAAS_API_KEY: ${MAAS_API_KEY:-}
      MAAS_BASE_URL: ${MAAS_BASE_URL:-https://api.modelarts-maas.com/v2}
      MAAS_MODEL: ${MAAS_MODEL:-DeepSeek-V3}
      # 问答限流（契约 §6.7）：多副本部署时实际阈值为「本值 × 副本数」
      CHAT_RATE_LIMIT_REQUESTS: ${CHAT_RATE_LIMIT_REQUESTS:-10}
      CHAT_RATE_LIMIT_WINDOW_SECONDS: ${CHAT_RATE_LIMIT_WINDOW_SECONDS:-60}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "until alembic upgrade head; do echo '等待数据库就绪…'; sleep 3; done &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  db:
    image: mysql:8
    container_name: campus-service-assistant-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-campus}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
    ports:
      # 仅绑定本机回环，供宿主机导入知识库使用
      - "127.0.0.1:3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  db-data:
