<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校园办事小秘书 · 系统总体架构</title>
  <style>
    :root { --page:#fdfdfd; --surface:#fffaf7; --ink:#1b110e; --muted:#765d55; --border:#e9dbd4; --accent:#b53f1d; --accent-soft:#fff0e8; --link:#76504a; --font-body:'DM Sans','PingFang SC','Microsoft YaHei',sans-serif; --font-display:'Epilogue','PingFang SC','Microsoft YaHei',sans-serif; --font-mono:'Cascadia Mono','Microsoft YaHei',monospace; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--page); color:var(--ink); font-family:var(--font-body); }
    main { max-width:1400px; margin:0 auto; padding:48px 40px 72px; }
    .eyebrow { color:var(--accent); font:700 11px var(--font-mono); letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:12px 0 10px; font:900 clamp(30px,4vw,52px)/1.02 var(--font-display); letter-spacing:-.04em; }
    .intro { max-width:760px; color:var(--muted); font-size:16px; line-height:1.7; }
    .diagram-container { width:100%; overflow-x:auto; margin-top:34px; border:1px solid var(--border); background:var(--surface); }
    svg { display:block; width:100%; min-width:1280px; height:auto; }
    .zone-label,.tag,.edge-label { font-family:var(--font-mono); letter-spacing:.1em; text-transform:uppercase; }
    .zone-label { font-size:11px; fill:var(--muted); }
    .tag { font-size:10px; fill:var(--accent); }
    .node-name { font:700 16px var(--font-body); fill:var(--ink); }
    .node-sub { font:12px var(--font-mono); fill:var(--muted); }
    .edge-label { font-size:11px; fill:var(--muted); }
    .legend { display:flex; gap:24px; flex-wrap:wrap; padding:18px 22px; border-top:1px solid var(--border); color:var(--muted); font:12px var(--font-mono); }
    .legend span { display:inline-flex; align-items:center; gap:8px; }
    .dot { width:10px; height:10px; border-radius:50%; border:1px solid var(--muted); display:inline-block; }
    .dot.accent { background:var(--accent); border-color:var(--accent); }
    .dot.store { background:#f6e6dd; border-color:var(--accent); }
    .dot.external { background:#eee6e2; }
    .note { margin-top:22px; padding:18px 20px; border-left:3px solid var(--accent); background:var(--accent-soft); color:var(--muted); line-height:1.65; }
    @media print { main { padding:20px; } .diagram-container { overflow-x:visible; border:0; } svg { min-width:0; } }
  </style>
</head>
<body>
<main>
  <div class="eyebrow">Campus Service Assistant · Architecture</div>
  <h1>校园办事小秘书 · 系统总体架构</h1>
  <p class="intro">系统以 Vue 3 前端承载学生交互，以 Nginx 提供静态资源和反向代理，以 FastAPI 编排安全校验、意图识别、知识检索、模型生成和结构化输出，并把会话、消息、事项与核验知识统一持久化到 MySQL。</p>

  <div class="diagram-container">
  <svg viewBox="0 0 1280 720" role="img" aria-labelledby="campus-architecture-title campus-architecture-desc">
    <title id="campus-architecture-title">校园办事小秘书系统总体架构</title>
    <desc id="campus-architecture-desc">展示学生、Vue 前端、Nginx、FastAPI 问答编排、知识与会话数据、MySQL、AgentArts 或 MaaS 模型服务及 Docker 部署边界之间的关系。</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#765d55"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#b53f1d"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#76504a"/></marker>
    </defs>
    <rect width="1280" height="720" fill="#fdfdfd"/>

    <!-- zones -->
    <rect x="40" y="78" width="200" height="432" rx="8" fill="#1b110e" fill-opacity=".025" stroke="#1b110e" stroke-opacity=".12"/>
    <rect x="276" y="78" width="684" height="432" rx="8" fill="#1b110e" fill-opacity=".025" stroke="#1b110e" stroke-opacity=".12"/>
    <rect x="996" y="78" width="244" height="432" rx="8" fill="#1b110e" fill-opacity=".025" stroke="#1b110e" stroke-opacity=".12"/>
    <rect x="56" y="82" width="104" height="20" rx="2" fill="#fdfdfd"/><text x="108" y="96" text-anchor="middle" class="zone-label">CLIENT</text>
    <rect x="292" y="82" width="158" height="20" rx="2" fill="#fdfdfd"/><text x="371" y="96" text-anchor="middle" class="zone-label">APPLICATION</text>
    <rect x="1012" y="82" width="124" height="20" rx="2" fill="#fdfdfd"/><text x="1074" y="96" text-anchor="middle" class="zone-label">DATA / MODEL</text>

    <!-- connectors first -->
    <path d="M220 244 H288 Q296 244 296 252 V252 H344" fill="none" stroke="#b53f1d" stroke-width="2" marker-end="url(#arrow-accent)"/>
    <rect x="238" y="224" width="84" height="18" rx="3" fill="#fdfdfd"/><text x="280" y="237" text-anchor="middle" class="edge-label">HTTPS</text>
    <path d="M480 244 H520 Q528 244 528 252 V252 H568" fill="none" stroke="#b53f1d" stroke-width="2" marker-end="url(#arrow-accent)"/>
    <rect x="486" y="224" width="84" height="18" rx="3" fill="#fdfdfd"/><text x="528" y="237" text-anchor="middle" class="edge-label">/API</text>
    <path d="M704 244 H744 Q752 244 752 252 V252 H792" fill="none" stroke="#b53f1d" stroke-width="2" marker-end="url(#arrow-accent)"/>
    <rect x="714" y="224" width="86" height="18" rx="3" fill="#fdfdfd"/><text x="757" y="237" text-anchor="middle" class="edge-label">ANSWER</text>
    <path d="M904 220 H948 Q956 220 956 212 V188 H1018" fill="none" stroke="#765d55" stroke-width="1.4" marker-end="url(#arrow)"/>
    <rect x="920" y="176" width="94" height="18" rx="3" fill="#fdfdfd"/><text x="967" y="189" text-anchor="middle" class="edge-label">RETRIEVE</text>
    <path d="M904 308 H948 Q956 308 956 316 V342 H1018" fill="none" stroke="#76504a" stroke-width="1.4" marker-end="url(#arrow-link)"/>
    <rect x="918" y="324" width="94" height="18" rx="3" fill="#fdfdfd"/><text x="965" y="337" text-anchor="middle" class="edge-label">GENERATE</text>
    <path d="M840 294 V394 Q840 402 832 402 H756" fill="none" stroke="#765d55" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="786" y="382" width="92" height="18" rx="3" fill="#fdfdfd"/><text x="832" y="395" text-anchor="middle" class="edge-label">PERSIST</text>
    <path d="M652 322 V402 Q652 410 644 410 H596" fill="none" stroke="#765d55" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="608" y="382" width="88" height="18" rx="3" fill="#fdfdfd"/><text x="652" y="395" text-anchor="middle" class="edge-label">WRITE</text>

    <!-- nodes -->
    <g>
      <rect x="64" y="190" width="156" height="108" rx="6" fill="#fdfdfd" stroke="#b53f1d" stroke-width="1.5"/>
      <rect x="80" y="206" width="48" height="18" rx="2" fill="#fff0e8"/><text x="104" y="219" text-anchor="middle" class="tag">INPUT</text>
      <text x="80" y="252" class="node-name">学生用户</text><text x="80" y="274" class="node-sub">浏览器 / 移动端</text>
    </g>
    <g>
      <rect x="344" y="190" width="136" height="108" rx="6" fill="#fdfdfd" stroke="#1b110e" stroke-opacity=".35"/>
      <rect x="360" y="206" width="54" height="18" rx="2" fill="#f3ece8"/><text x="387" y="219" text-anchor="middle" class="tag">WEB</text>
      <text x="360" y="252" class="node-name">Vue 3 前端</text><text x="360" y="274" class="node-sub">Vite · TypeScript</text>
    </g>
    <g>
      <rect x="568" y="190" width="136" height="108" rx="6" fill="#fff0e8" stroke="#b53f1d" stroke-width="1.5"/>
      <rect x="584" y="206" width="58" height="18" rx="2" fill="#b53f1d"/><text x="613" y="219" text-anchor="middle" fill="#fff" class="tag">CORE</text>
      <text x="584" y="252" class="node-name">FastAPI 后端</text><text x="584" y="274" class="node-sub">安全 · 编排 · API</text>
    </g>
    <g>
      <rect x="792" y="190" width="112" height="108" rx="6" fill="#fdfdfd" stroke="#1b110e" stroke-opacity=".35"/>
      <rect x="808" y="206" width="58" height="18" rx="2" fill="#f3ece8"/><text x="837" y="219" text-anchor="middle" class="tag">FLOW</text>
      <text x="808" y="250" class="node-name">问答流水线</text><text x="808" y="272" class="node-sub">清洗 → 检索</text><text x="808" y="289" class="node-sub">生成 → 校验</text>
    </g>
    <g>
      <rect x="1018" y="142" width="188" height="92" rx="6" fill="#f6e6dd" stroke="#b53f1d" stroke-width="1.2"/>
      <rect x="1034" y="158" width="54" height="18" rx="2" fill="#fffaf7"/><text x="1061" y="171" text-anchor="middle" class="tag">STORE</text>
      <text x="1034" y="202" class="node-name">MySQL 业务数据库</text><text x="1034" y="222" class="node-sub">事项 · 知识 · 会话 · 反馈</text>
    </g>
    <g>
      <rect x="1018" y="296" width="188" height="92" rx="6" fill="#eee6e2" stroke="#76504a" stroke-width="1.2"/>
      <rect x="1034" y="312" width="72" height="18" rx="2" fill="#fdfdfd"/><text x="1070" y="325" text-anchor="middle" class="tag">EXTERNAL</text>
      <text x="1034" y="356" class="node-name">AgentArts / MaaS</text><text x="1034" y="376" class="node-sub">工作流或模型生成</text>
    </g>
    <g>
      <rect x="520" y="370" width="136" height="82" rx="6" fill="#fdfdfd" stroke="#1b110e" stroke-opacity=".35"/>
      <rect x="536" y="386" width="54" height="18" rx="2" fill="#f3ece8"/><text x="563" y="399" text-anchor="middle" class="tag">RULES</text>
      <text x="536" y="426" class="node-name">安全与治理</text><text x="536" y="445" class="node-sub">清洗 · 限流 · 拒答</text>
    </g>
    <g>
      <rect x="680" y="370" width="136" height="82" rx="6" fill="#fdfdfd" stroke="#1b110e" stroke-opacity=".35"/>
      <rect x="696" y="386" width="58" height="18" rx="2" fill="#f3ece8"/><text x="725" y="399" text-anchor="middle" class="tag">OPS</text>
      <text x="696" y="426" class="node-name">迁移与导入</text><text x="696" y="445" class="node-sub">Alembic · 知识脚本</text>
    </g>
    <g>
      <rect x="300" y="370" width="136" height="82" rx="6" fill="#fdfdfd" stroke="#1b110e" stroke-opacity=".35"/>
      <rect x="316" y="386" width="58" height="18" rx="2" fill="#f3ece8"/><text x="345" y="399" text-anchor="middle" class="tag">EDGE</text>
      <text x="316" y="426" class="node-name">Nginx</text><text x="316" y="445" class="node-sub">静态资源 · 反向代理</text>
    </g>

    <rect x="40" y="554" width="1200" height="92" rx="8" fill="#1b110e" fill-opacity=".025" stroke="#1b110e" stroke-opacity=".12"/>
    <text x="64" y="582" class="zone-label">DEPLOYMENT · DOCKER COMPOSE</text>
    <text x="64" y="610" class="node-sub">frontend :80</text><text x="240" y="610" class="node-sub">backend :8000</text><text x="420" y="610" class="node-sub">db :3306（仅本机回环）</text><text x="760" y="610" class="node-sub">健康检查 · 自动迁移 · db-data 卷</text>
    <text x="64" y="631" class="node-sub">生产环境启动顺序：数据库健康 → Alembic upgrade head → Uvicorn → Nginx 对外提供服务</text>
  </svg>
  <div class="legend"><span><i class="dot accent"></i>主请求链路</span><span><i class="dot store"></i>持久化数据</span><span><i class="dot external"></i>外部模型服务</span><span>实线：同步调用 · 虚线：写入或运维辅助链路</span></div>
  </div>
  <div class="note">阅读路径：先看中间的主链路，再看右侧的数据与模型依赖，最后看底部 Docker Compose 部署边界。详细模块职责、接口和时序请参阅同目录的《系统架构文档》。 </div>
</main>
</body>
</html>
